name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Run demo (offline, deterministic)
        run: |
          python -m agent_harness demo flaky_recovery --no-color
          python -m agent_harness demo timeout_then_cache --no-color
          python -m agent_harness demo unsafe_blocked --no-color

      - name: Render trace report
        run: python -m agent_harness report traces/demo-flaky_recovery.jsonl

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: traces-and-report-py${{ matrix.python-version }}
          path: |
            traces/*.jsonl
            reports/*.html
