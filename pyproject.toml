[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-harness"
version = "0.1.0"
description = "Agent orchestration reliability harness — typed tools, deterministic orchestrator, traces, retry/fallback, failure classification, and a safety gate."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Donald B. Havery", email = "dbhavery@gmail.com" }]
dependencies = [
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# Optional real-LLM planner (never required for the demo or tests).
llm = [
    "anthropic>=0.40",
]

[project.scripts]
agent-harness = "agent_harness.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_harness = ["fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
